<script>
  (function () {
    var html = document.documentElement;
    var tgPlatform = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.platform) || '';
    var ua = navigator.userAgent || '';
    var cls;
    if (tgPlatform === 'android') cls = 'is-android';
    else if (tgPlatform === 'ios') cls = 'is-ios';
    else if (tgPlatform === 'macos' || tgPlatform === 'tdesktop') cls = 'is-desktop';
    else if (/Android/i.test(ua)) cls = 'is-android';
    else if (/iPhone|iPad|iPod/i.test(ua)) cls = 'is-ios';

    html.classList.remove('is-android', 'is-ios', 'is-desktop');
    html.classList.add(cls);
  })();
</script>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none;height:100%}
body{
  background-color:var(--bg-base);font-family:"SF Pro Display","Inter",-apple-system,sans-serif;color:var(--text-main);
  min-height:100vh;letter-spacing:-0.02em;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding:12px 12px 24px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;overscroll-behavior-y:none;position:relative;display:flex;flex-direction:column;min-height:100vh
}

/* ===================== ФОН: та же система рябь/сияние/зерно ===================== */
#vignette{position:fixed;inset:0;z-index:-4;pointer-events:none;background:
  linear-gradient(180deg,rgba(103,0,230,0.6) 0%,rgba(76,0,185,0.28) 26%,transparent 52%),
  radial-gradient(120% 90% at 50% -10%,rgba(112,0,255,0.32),transparent 55%),
  radial-gradient(140% 100% at 50% 110%,rgba(0,0,0,0.7),transparent 50%),
  radial-gradient(90% 70% at 50% 50%,transparent 46%,rgba(0,0,0,0.7) 100%)}
#vignette::after{content:'';position:absolute;inset:0;opacity:0.05;mix-blend-mode:overlay;background-image:var(--noise-png-url);background-repeat:repeat;background-size:128px 128px;transform:translateZ(0);backface-visibility:hidden}

#u-focus-dim{position:fixed;inset:0;z-index:-4;pointer-events:none;background:radial-gradient(circle at 50% 46%,transparent 0%,transparent 20%,rgba(5,0,14,0.30) 42%,rgba(4,0,11,0.62) 64%,rgba(3,0,9,0.84) 84%,rgba(2,0,6,0.94) 100%);animation:uFocusDimBreathe 6s ease-in-out infinite}
@keyframes uFocusDimBreathe{0%,100%{opacity:0.85}50%{opacity:1}}
html.is-android #u-focus-dim{animation:none;opacity:0.92}
@media (prefers-reduced-motion:reduce){#u-focus-dim{animation:none;opacity:0.94}}

#bg-tint{position:fixed;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(160deg,rgba(10,2,24,0.58),rgba(4,0,10,0.72));mix-blend-mode:multiply}

#depth-haze{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden}
#depth-haze span{position:absolute;border-radius:50%;mix-blend-mode:screen;will-change:transform,opacity}
#depth-haze .h1{width:72vw;height:72vw;left:-18%;top:-14%;background:radial-gradient(circle,rgba(58,18,110,0.24) 0%,rgba(38,10,78,0.11) 45%,transparent 72%);animation:hazeDrift1 76s ease-in-out infinite alternate}
#depth-haze .h2{width:66vw;height:66vw;right:-22%;bottom:-16%;background:radial-gradient(circle,rgba(18,4,42,0.30) 0%,rgba(14,3,32,0.13) 48%,transparent 74%);animation:hazeDrift2 94s ease-in-out infinite alternate-reverse}
#depth-haze .h3{width:54vw;height:54vw;left:28%;top:42%;background:radial-gradient(circle,rgba(48,14,92,0.16) 0%,rgba(32,7,66,0.07) 50%,transparent 76%);animation:hazeDrift3 61s ease-in-out infinite alternate}
@keyframes hazeDrift1{0%{transform:translate3d(0,0,0) scale(1);opacity:0.7}100%{transform:translate3d(6vw,8vh,0) scale(1.12);opacity:1}}
@keyframes hazeDrift2{0%{transform:translate3d(0,0,0) scale(1);opacity:0.6}100%{transform:translate3d(-8vw,-5vh,0) scale(1.08);opacity:0.9}}
@keyframes hazeDrift3{0%{transform:translate3d(0,0,0) scale(1);opacity:0.5}100%{transform:translate3d(4vw,-6vh,0) scale(1.15);opacity:0.8}}
@media (prefers-reduced-motion:reduce){#depth-haze span{animation:none;opacity:0.8}}

/* Рябь: canvas с шейдер-подобным радиальным волновым полем, реагирует на движение курсора */
#ripple-canvas{position:fixed;inset:0;z-index:-5;width:100%;height:100%;display:block;pointer-events:none}

#mesh{position:fixed;inset:0;z-index:-3;pointer-events:none;filter:blur(70px) saturate(160%);overflow:hidden;will-change:filter,transform;transform:translateZ(0);backface-visibility:hidden;contain:paint}
@media (max-width:480px){#mesh{filter:blur(34px) saturate(160%)}}
html.is-android #mesh{filter:blur(34px) saturate(160%)}
#mesh-track{position:absolute;inset:-10%}
#mesh span{position:absolute;border-radius:50%;will-change:transform;mix-blend-mode:screen}
#mesh .b1{width:80vw;height:80vw;left:-10%;top:-10%;background:radial-gradient(circle,rgba(130,40,255,0.30),transparent 70%);animation:orbFloat1 26s infinite alternate var(--ease),blobMorph1 14s infinite alternate ease-in-out}
#mesh .b2{width:70vw;height:70vw;right:-20%;top:40%;background:radial-gradient(circle,rgba(200,100,255,0.22),transparent 70%);animation:orbFloat2 32s infinite alternate-reverse var(--ease),blobMorph2 17s infinite alternate ease-in-out}
#mesh .b3{width:90vw;height:90vw;left:10%;bottom:-30%;background:radial-gradient(circle,rgba(52,199,123,0.15),transparent 70%);animation:orbFloat3 29s infinite alternate var(--ease),blobMorph3 20s infinite alternate ease-in-out}
@keyframes orbFloat1{0%{transform:translate(0,0) scale(1) rotate(0deg)}100%{transform:translate(20vw,15vh) scale(1.22) rotate(45deg)}}
@keyframes orbFloat2{0%{transform:translate(0,0) scale(1) rotate(0deg)}100%{transform:translate(-30vw,-20vh) scale(1.12) rotate(-30deg)}}
@keyframes orbFloat3{0%{transform:translate(0,0) scale(1)}100%{transform:translate(10vw,-30vh) scale(1.3)}}
@keyframes blobMorph1{0%{border-radius:42% 58% 65% 35% / 45% 40% 60% 55%}50%{border-radius:60% 40% 35% 65% / 55% 65% 35% 45%}100%{border-radius:48% 52% 55% 45% / 40% 55% 45% 60%}}
@keyframes blobMorph2{0%{border-radius:55% 45% 40% 60% / 50% 45% 55% 50%}50%{border-radius:38% 62% 58% 42% / 60% 50% 50% 40%}100%{border-radius:50% 50% 48% 52% / 45% 55% 45% 55%}}
@keyframes blobMorph3{0%{border-radius:50% 50% 45% 55% / 55% 45% 55% 45%}50%{border-radius:62% 38% 60% 40% / 42% 58% 42% 58%}100%{border-radius:45% 55% 50% 50% / 50% 50% 50% 50%}}

button,[type="button"]{background:transparent;border:none;font-family:inherit;color:inherit;cursor:pointer;outline:none}
button,[type="button"],[role="button"],a,.icon-btn,.lang-switch{touch-action:manipulation}

/* ===================== ЛОГО: idle-дыхание, без саги ===================== */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;padding:0 8px}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo-container{width:44px;height:44px;position:relative;flex-shrink:0;display:block}
.brand-mark{
  width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--purple-accent),var(--purple));
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:var(--text-main);
  box-shadow:0 10px 25px var(--purple-glow),inset 0 2px 4px rgba(255,255,255,0.6),inset 0 -4px 10px rgba(0,0,0,0.3);
  position:relative;overflow:visible;transform:translate3d(0,0,0) scale(1);
  animation:markIdleBreathe 4.4s ease-in-out infinite;
  backface-visibility:hidden;z-index:2
}
@keyframes markIdleBreathe{0%,100%{transform:scale(1);box-shadow:0 10px 25px var(--purple-glow),inset 0 2px 4px rgba(255,255,255,0.6),inset 0 -4px 10px rgba(0,0,0,0.3)}50%{transform:scale(1.045);box-shadow:0 14px 32px var(--purple-glow),inset 0 2px 4px rgba(255,255,255,0.65),inset 0 -4px 10px rgba(0,0,0,0.32)}}
@media (prefers-reduced-motion:reduce){.brand-mark{animation:none}}
.brand-mark .mark-letter{position:relative;z-index:2}
.mark-sheen{position:absolute;inset:0;z-index:4;border-radius:inherit;pointer-events:none;overflow:hidden}
.mark-sheen::before{content:'';position:absolute;top:-50%;left:-50%;width:90%;height:200%;background:radial-gradient(ellipse at center,rgba(255,255,255,0.65),rgba(255,255,255,0.12) 55%,transparent 78%);transform:translate(-30%,-10%) rotate(8deg);filter:blur(1.5px);will-change:transform,opacity;mix-blend-mode:screen;animation:markSheenIdleWide 7s ease-in-out infinite}
.mark-sheen::after{content:'';position:absolute;top:-40%;left:-60%;width:34%;height:220%;background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,0.05) 35%,rgba(255,255,255,0.9) 50%,rgba(255,255,255,0.05) 65%,transparent 100%);transform:translateX(-40%) rotate(14deg);will-change:transform,opacity;animation:markSheenIdleLine 7s ease-in-out infinite}
@keyframes markSheenIdleWide{0%,82%,100%{transform:translate(-30%,-10%) rotate(8deg);opacity:0}88%{opacity:0.55}95%{transform:translate(30%,6%) rotate(8deg);opacity:0.35}}
@keyframes markSheenIdleLine{0%,80%,100%{transform:translateX(-40%) rotate(14deg);opacity:0}86%{opacity:0.9}94%{transform:translateX(160%) rotate(14deg);opacity:0}}
.mark-gleam{position:absolute;inset:0;border-radius:inherit;z-index:3;pointer-events:none;background:radial-gradient(circle,rgba(157,77,255,0.55),transparent 70%);filter:blur(9px);opacity:0.35;animation:markGlowPulse 4.4s ease-in-out infinite}
@keyframes markGlowPulse{0%,100%{opacity:0.22;transform:scale(0.94)}50%{opacity:0.48;transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.mark-sheen::before,.mark-sheen::after,.mark-gleam{animation:none}}

.brand-text{display:flex;flex-direction:column;gap:2px}
.brand-name{position:relative;font-weight:900;font-size:19px;letter-spacing:-0.03em;color:#F3EAFF;text-shadow:0 0 1px rgba(255,255,255,0.4);-webkit-text-stroke:0.5px rgba(200,60,130,0.4);filter:drop-shadow(0.6px 0 0 rgba(157,77,255,0.7)) drop-shadow(-0.6px 0 0 rgba(255,60,60,0.4)) drop-shadow(0 2px 10px rgba(157,77,255,0.4));animation:brandNameGlow 3.4s ease-in-out infinite;white-space:nowrap}
@keyframes brandNameGlow{0%,100%{filter:drop-shadow(0.6px 0 0 rgba(157,77,255,0.7)) drop-shadow(-0.6px 0 0 rgba(255,60,60,0.4)) drop-shadow(0 2px 10px rgba(157,77,255,0.4))}50%{filter:drop-shadow(0.8px 0 0 rgba(157,77,255,0.85)) drop-shadow(-0.8px 0 0 rgba(255,70,70,0.55)) drop-shadow(0 2px 14px rgba(157,77,255,0.65))}}
.brand-sub{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.16em;font-weight:800;background:linear-gradient(90deg,var(--text-muted),var(--text-main));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}

.topbar-actions{display:flex;align-items:center;gap:8px}
.icon-btn,.lang-switch{height:44px;border-radius:14px;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--glass-border-dark);border-top:1px solid var(--glass-border-light);color:var(--text-main);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,0.5);transition:all 0.3s var(--spring);cursor:pointer;position:relative;transform:translateZ(0)}

@keyframes pupilGlintIdle{0%,100%{opacity:0.75;transform:scale(1) translate(0,0)}30%{opacity:0.95;transform:scale(1.08) translate(3%,-2%)}55%{opacity:0.65;transform:scale(0.94) translate(-2%,3%)}80%{opacity:0.9;transform:scale(1.04) translate(2%,1%)}}
.bot-pupil-umark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2;opacity:0.9}
.bot-pupil-umark svg{width:44%;height:44%;fill:none;stroke:#fff;stroke-width:2.4;filter:drop-shadow(0 0 3px rgba(255,255,255,0.6))}
@media (prefers-reduced-motion:reduce){.bot-eye{animation:none}.bot-eye-lid::after{animation:none}.bot-pupil-glint{animation:none}}

/* ===================== Skeleton / util ===================== */
.wrap-inner{display:flex;flex-direction:column;gap:16px;flex:1}
</style>
</head>
<body>

<div id="vignette"></div>
<div id="u-focus-dim" aria-hidden="true"></div>
<div id="depth-haze" aria-hidden="true"><span class="h1"></span><span class="h2"></span><span class="h3"></span></div>
<canvas id="ripple-canvas" aria-hidden="true"></canvas>
<div id="mesh"><div id="mesh-track"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div></div>
<div id="bg-tint"></div>

<div class="wrap">
  <div class="wrap-inner">

    <div class="topbar stagger parallax-el" data-depth="0.04" style="animation-delay:0.2s">
      <div class="brand">
        <div class="brand-logo-container">
          <div class="brand-mark glass-bubble" id="brand-mark" aria-label="Uzum">
            <span class="mark-letter">U</span>
            <span class="mark-sheen" aria-hidden="true"></span>
            <span class="mark-gleam" aria-hidden="true"></span>
          </div>
        </div>
        <div class="brand-text">
          <div class="brand-name">Uzum Хаб</div>
          <div class="brand-sub" data-i18n="brand_sub">Меню экосистемы ПВЗ</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="lang-switch glass-edge parallax-el" id="btn-lang" type="button" data-depth="0.18">
          <span class="lang-globe">🌐</span><span class="lang-cur" id="lang-cur">RU</span>
        </button>
        <div class="icon-btn glass-edge parallax-el" id="btn-info" data-depth="0.22">?</div>
      </div>
    </div>

    <div class="hero stagger parallax-el" data-depth="0.03" style="animation-delay:0.9s">
      <div class="hero-title" data-i18n="hero_title">Экосистема Uzum PVZ</div>
      <div class="hero-sub" data-i18n="hero_sub">Выберите инструмент, с которым хотите работать прямо сейчас.</div>
    </div>

    <!-- Портал 1: Invent Bot -->
    <div class="card glass-edge stagger parallax-el" data-depth="0.06" style="animation-delay:1.6s">
      <div class="grain"></div>
      <div class="card-eyebrow"><span class="dot"></span><span data-i18n="invent_eyebrow">ИНВЕНТАРИЗАЦИЯ</span></div>
      <div class="portal-wrap">
        <a class="portal portal-invent" id="portal-invent" href="https://thebuddy53.github.io/UZUM-INVENT/" rel="noopener" data-stiffness="360" data-damping="17" data-stretch="1">
          <div class="portal-drip-layer" aria-hidden="true">
            <span class="p-drip pd1"></span><span class="p-drip pd2"></span><span class="p-drip pd3"></span><span class="p-drip pd4"></span><span class="p-drip pd5"></span>
          </div>
          <span class="portal-toplight" aria-hidden="true"></span>
          <span class="portal-shine" aria-hidden="true"></span>
          <span class="portal-icon-wrap" aria-hidden="true">📦</span>
          <span class="portal-text">
            <span class="portal-title" data-i18n="invent_title">Uzum Invent Bot</span>
            <span class="portal-sub" data-i18n="invent_sub">Сканирование склада и сверка остатков →</span>
          </span>
          <span class="portal-arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </div>

    <!-- Портал 2: SLA -->
    <div class="card glass-edge stagger parallax-el" data-depth="0.05" style="animation-delay:2.3s">
      <div class="grain"></div>
      <div class="card-eyebrow"><span class="dot"></span><span data-i18n="sla_eyebrow">КОНТРОЛЬ СЛА</span></div>
      <div class="portal-wrap">
        <a class="portal portal-sla" id="portal-sla" href="https://thebuddy53.github.io/SLA-UZUM/" rel="noopener" data-stiffness="360" data-damping="17" data-stretch="1">
          <div class="portal-drip-layer" aria-hidden="true">
            <span class="p-drip pd1"></span><span class="p-drip pd2"></span><span class="p-drip pd3"></span><span class="p-drip pd4"></span><span class="p-drip pd5"></span>
          </div>
          <span class="portal-toplight" aria-hidden="true"></span>
          <span class="portal-shine" aria-hidden="true"></span>
          <span class="portal-icon-wrap" aria-hidden="true">⏱</span>
          <span class="portal-text">
            <span class="portal-title" data-i18n="sla_title">SLA приёмки</span>
            <span class="portal-sub" data-i18n="sla_sub">Контроль сроков приёмки на ПВЗ →</span>
          </span>
          <span class="portal-arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </div>

    <div class="footer stagger parallax-el" data-depth="0.02" style="animation-delay:3.0s">
      <div class="footer-mark"><span class="fdot">U</span> Uzum Ecosystem</div>
      <div class="bot-eyes" id="bot-eyes">
        <button class="bot-eye" id="bot-eye-l" type="button" data-side="left" aria-label="Uzum eye">
          <span class="bot-eye-vein"></span>
          <span class="bot-eye-depth-ring" aria-hidden="true"></span>
          <span class="bot-eye-lid">
            <span class="bot-pupil" id="bot-pupil-l"><span class="bot-pupil-glint" id="bot-glint-l"></span><span class="bot-pupil-umark" aria-hidden="true"><svg viewBox="0 0 24 20"><path d="M3 2 L3 12 Q3 17 12 17 Q21 17 21 12 L21 2"/></svg></span></span>
          </span>
        </button>
        <button class="bot-eye" id="bot-eye-r" type="button" data-side="right" aria-label="Uzum eye">
          <span class="bot-eye-vein"></span>
          <span class="bot-eye-depth-ring" aria-hidden="true"></span>
          <span class="bot-eye-lid">
            <span class="bot-pupil" id="bot-pupil-r"><span class="bot-pupil-glint" id="bot-glint-r"></span><span class="bot-pupil-umark" aria-hidden="true"><svg viewBox="0 0 24 20"><path d="M3 2 L3 12 Q3 17 12 17 Q21 17 21 12 L21 2"/></svg></span></span>
          </span>
        </button>
      </div>
    </div>

  </div>
</div>

<div id="sla-exit-veil" aria-hidden="true" style="position:fixed;inset:0;z-index:810;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 0%,rgba(5,0,14,0.92) 55%,#030007 100%);opacity:0;transition:opacity 0.32s cubic-bezier(0.7,0,0.9,0.4)"></div>
<style>
body.exit-transition .wrap-inner > *{transition:opacity 0.4s cubic-bezier(0.6,0,0.9,0.2),filter 0.4s cubic-bezier(0.6,0,0.9,0.2),transform 0.4s cubic-bezier(0.6,0,0.9,0.2);opacity:0;transform:scale(0.85) translateZ(0);filter:blur(14px);pointer-events:none}
body.exit-transition .wrap-inner > *:nth-child(1){transition-delay:0s}
body.exit-transition .wrap-inner > *:nth-child(2){transition-delay:0.04s}
body.exit-transition .wrap-inner > *:nth-child(3){transition-delay:0.08s}
body.exit-transition .wrap-inner > *:nth-child(4){transition-delay:0.12s}
body.exit-transition .wrap-inner > *:nth-child(n+5){transition-delay:0.16s}
body.exit-transition #sla-exit-veil{opacity:1}
</style>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ===================== 1. Canvas-рябь фона, движется от курсора ===================== */
  (function ripple(){
    var canvas = $('ripple-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d', { alpha: true });
    var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
    var rings = [];
    var lastSpawn = 0;
    var mouseX = null, mouseY = null;
    var idleAngle = 0;

    function resize(){
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * DPR; canvas.height = H * DPR;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(DPR,0,0,DPR,0,0);
    }
    window.addEventListener('resize', resize, { passive: true });
    resize();

    function spawnRing(x, y, strength){
      rings.push({ x: x, y: y, r: 0, life: 0, maxR: 140 + strength * 260, alpha: 0.30 * strength });
      if (rings.length > 24) rings.shift();
    }

    window.addEventListener('pointermove', function(e){
      mouseX = e.clientX; mouseY = e.clientY;
      var now = performance.now();
      if (now - lastSpawn > 90) {
        lastSpawn = now;
        spawnRing(e.clientX, e.clientY, 0.55);
      }
    }, { passive: true });

    window.addEventListener('pointerdown', function(e){
      spawnRing(e.clientX, e.clientY, 1.1);
    }, { passive: true });

    var lastT = 0;
    function tick(ts){
      if (!lastT) lastT = ts;
      var dt = Math.min(0.05, (ts - lastT) / 1000);
      lastT = ts;
      idleAngle += dt * 0.15;

      ctx.clearRect(0, 0, W, H);

      // фоновая едва заметная "дышащая" рябь по центру, даже без курсора
      var cx = W * 0.5 + Math.sin(idleAngle) * W * 0.06;
      var cy = H * 0.42 + Math.cos(idleAngle * 0.8) * H * 0.04;
      var idleR = (Math.sin(idleAngle * 0.6) * 0.5 + 0.5) * 90 + 40;
      ctx.beginPath();
      ctx.arc(cx, cy, idleR, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(157,77,255,0.05)';
      ctx.lineWidth = 2;
      ctx.stroke();

      for (var i = rings.length - 1; i >= 0; i--) {
        var ring = rings[i];
        ring.life += dt;
        var p = ring.life / 1.15;
        if (p >= 1) { rings.splice(i, 1); continue; }
        ring.r = ring.maxR * (1 - Math.pow(1 - p, 2));
        var a = ring.alpha * (1 - p);
        ctx.beginPath();
        ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(190,140,255,' + a.toFixed(3) + ')';
        ctx.lineWidth = 1.6 * (1 - p * 0.6);
        ctx.stroke();
      }

      requestAnimationFrame(tick);
    }
    if (!reduceMotion) requestAnimationFrame(tick);
  })();

  /* ===================== 2. Параллакс курсора для карточек/лого/иконок ===================== */
  (function parallax(){
    var meshTrack = $('mesh-track');
    var parallaxEls = Array.prototype.slice.call(document.querySelectorAll('.parallax-el'));
    var parallaxCardEls = parallaxEls.filter(function(el){ return el.classList.contains('card'); });
    var parallaxPlainEls = parallaxEls.filter(function(el){ return !el.classList.contains('card'); });
    var isMobileUI = window.matchMedia('(pointer: coarse)').matches;
    var PARALLAX_AMP = isMobileUI ? 40 : 95;
    var mx = 0, my = 0, tx = 0, ty = 0, raf = null, lastT = 0;

    function tickMesh(now){
      now = now || performance.now();
      if (!lastT) lastT = now;
      var dt = Math.min((now - lastT) / 1000, 1/30);
      lastT = now;
      var lerp = 1 - Math.pow(1 - 0.08, dt * 60);
      mx += (tx - mx) * lerp;
      my += (ty - my) * lerp;
      if (meshTrack) meshTrack.style.transform = 'translate3d(' + mx.toFixed(2) + 'px, ' + my.toFixed(2) + 'px, 0)';

      var tiltFactorX = PARALLAX_AMP ? Math.max(-1, Math.min(1, (tx / PARALLAX_AMP) * 2.4)) : 0;
      var tiltFactorY = PARALLAX_AMP ? Math.max(-1, Math.min(1, (ty / PARALLAX_AMP) * 2.4)) : 0;
      var MAX_TILT_DEG = 20;

      parallaxPlainEls.forEach(function(el){
        var depth = parseFloat(el.dataset.depth || '0.15');
        var tiltDepth = Math.sqrt(depth / 0.22);
        var rotY = (tiltFactorX * MAX_TILT_DEG * tiltDepth).toFixed(2);
        var rotX = (-tiltFactorY * MAX_TILT_DEG * tiltDepth).toFixed(2);
        el.style.transform = 'perspective(900px) translate3d(' + (mx*depth).toFixed(2) + 'px, ' + (my*depth).toFixed(2) + 'px, 0) rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
      });
      parallaxCardEls.forEach(function(el){
        var depth = parseFloat(el.dataset.depth || '0.15');
        var tiltDepth = Math.sqrt(depth / 0.22);
        el.style.setProperty('--pfx', (mx*depth).toFixed(2) + 'px');
        el.style.setProperty('--pfy', (my*depth).toFixed(2) + 'px');
        if (isMobileUI) {
          el.style.setProperty('--ptx', '0deg');
          el.style.setProperty('--pty', '0deg');
        } else {
          el.style.setProperty('--ptx', (tiltFactorX * MAX_TILT_DEG * tiltDepth).toFixed(2) + 'deg');
          el.style.setProperty('--pty', (-tiltFactorY * MAX_TILT_DEG * tiltDepth).toFixed(2) + 'deg');
        }
      });

      var portals = document.querySelectorAll('.portal');
      portals.forEach(function(el){
        el.style.setProperty('--tilt-x', tiltFactorX.toFixed(3));
        el.style.setProperty('--tilt-y', tiltFactorY.toFixed(3));
      });

      if (Math.abs(tx - mx) > 0.05 || Math.abs(ty - my) > 0.05) {
        raf = requestAnimationFrame(tickMesh);
      } else { raf = null; lastT = 0; }
    }

    window.addEventListener('pointermove', function(e){
      tx = ((e.clientX / window.innerWidth) - 0.5) * PARALLAX_AMP;
      ty = ((e.clientY / window.innerHeight) - 0.5) * PARALLAX_AMP;
      if (!raf) raf = requestAnimationFrame(tickMesh);
    }, { passive: true });
  })();

  /* ===================== 3. Глаза следят за курсором (spring lag) ===================== */
  (function eyes(){
    var pupilL = $('bot-pupil-l'), pupilR = $('bot-pupil-r');
    if (!pupilL || !pupilR) return;
    if (reduceMotion) return;
    var MAX_OFFSET = 24;
    var glintL = $('bot-glint-l'), glintR = $('bot-glint-r');
    var px = window.innerWidth / 2, py = window.innerHeight * 0.3;
    var raf = null;

    function moveTo(cx, cy, mx, my){
      var dx = mx - cx, dy = my - cy;
      var dist = Math.hypot(dx, dy) || 1;
      var off = Math.min(MAX_OFFSET, dist / 10);
      return { x: (dx / dist) * off, y: (dy / dist) * off };
    }
    function applyParallax(pupilEl, glintEl, off){
      pupilEl.style.transform = 'translate(' + off.x.toFixed(1) + 'px, ' + off.y.toFixed(1) + 'px)';
      if (glintEl) {
        var gx = (off.x * -0.35).toFixed(1);
        var gy = (off.y * -0.35).toFixed(1);
        glintEl.style.transform = 'translate(' + gx + 'px, ' + gy + 'px)';
      }
    }

    var springState = { l: { x:0, y:0, vx:0, vy:0 }, r: { x:0, y:0, vx:0, vy:0 } };
    var SPRING_STIFF = 210, SPRING_DAMP = 22;
    function springStep(state, tx, ty, dt){
      var ax = (tx - state.x) * SPRING_STIFF - state.vx * SPRING_DAMP;
      var ay = (ty - state.y) * SPRING_STIFF - state.vy * SPRING_DAMP;
      state.vx += ax * dt; state.vy += ay * dt;
      state.x += state.vx * dt; state.y += state.vy * dt;
    }

    window.addEventListener('pointermove', function(e){
      px = e.clientX; py = e.clientY;
      if (!raf) raf = requestAnimationFrame(tick);
    }, { passive: true });

    var lastTs = 0;
    function tick(ts){
      var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
      lastTs = ts;
      var eyeL = pupilL.closest('.bot-eye'), eyeR = pupilR.closest('.bot-eye');
      if (eyeL) {
        var rL = eyeL.getBoundingClientRect();
        var l = moveTo(rL.left + rL.width/2, rL.top + rL.height/2, px, py);
        springStep(springState.l, l.x, l.y, dt);
        applyParallax(pupilL, glintL, { x: springState.l.x, y: springState.l.y });
      }
      if (eyeR) {
        var rR = eyeR.getBoundingClientRect();
        var r = moveTo(rR.left + rR.width/2, rR.top + rR.height/2, px, py);
        springStep(springState.r, r.x, r.y, dt);
        applyParallax(pupilR, glintR, { x: springState.r.x, y: springState.r.y });
      }
      raf = document.hidden ? null : requestAnimationFrame(tick);
    }
    document.addEventListener('visibilitychange', function(){
      if (!document.hidden && !raf) raf = requestAnimationFrame(tick);
    });
    raf = requestAnimationFrame(tick);

    // редкое моргание
    function scheduleBlink(){
      var delay = 3200 + Math.random() * 3600;
      setTimeout(function(){
        [$('bot-eye-l'), $('bot-eye-r')].forEach(function(el){
          if (!el) return;
          var lid = el.querySelector('.bot-eye-lid');
          if (!lid) return;
          lid.classList.add('auto-blink-now');
          setTimeout(function(){ lid.classList.remove('auto-blink-now'); }, 360);
        });
        scheduleBlink();
      }, delay);
    }
    scheduleBlink();
  })();

  /* ===================== 4. Переключатель языка (RU/UZ визуально) ===================== */
  (function lang(){
    var btn = $('btn-lang');
    var cur = $('lang-cur');
    if (!btn || !cur) return;
    var langs = ['RU', 'UZ'];
    var idx = 0;
    btn.addEventListener('click', function(){
      idx = (idx + 1) % langs.length;
      btn.classList.remove('lang-spin'); void btn.offsetWidth; btn.classList.add('lang-spin');
      cur.classList.remove('lang-flip'); void cur.offsetWidth; cur.classList.add('lang-flip');
      setTimeout(function(){ cur.textContent = langs[idx]; }, 220);
    });
  })();

  /* ===================== 5. Переход на внешние сайты с анимацией (как у SLA) ===================== */
  function bindPortalExit(id){
    var el = $(id);
    if (!el) return;
    el.addEventListener('click', function(e){
      e.preventDefault();
      var href = el.getAttribute('href');
      document.body.classList.add('exit-transition');
      setTimeout(function(){ window.location.href = href; }, 560);
    });
  }
  bindPortalExit('portal-invent');
  bindPortalExit('portal-sla');

  /* ===================== 6. Простая эластичная отдача при нажатии на портал-кнопки ===================== */
  function makeElastic(el){
    if (!el) return;
    var pressing = false;
    el.addEventListener('pointerdown', function(){
      pressing = true;
      el.classList.add('elastic-live');
      el.style.transform = 'scale(0.97) translateZ(0)';
    });
    function release(){
      if (!pressing) return;
      pressing = false;
      el.classList.remove('elastic-live');
      el.style.transform = '';
    }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointerleave', release);
    el.addEventListener('pointercancel', release);
  }
  makeElastic($('portal-invent'));
  makeElastic($('portal-sla'));
  makeElastic($('brand-mark'));

  /* stagger cleanup */
  document.querySelectorAll('.stagger').forEach(function(el){
    el.addEventListener('animationend', function onEnd(e){
      if (e.target !== el) return;
      el.classList.remove('stagger');
      el.removeEventListener('animationend', onEnd);
    });
  });
})();
</script>
